<title>My Slips · Edge Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --sans:Inter,system-ui,sans-serif; --serif:"Source Serif 4",Georgia,serif;
  --fg:#1f1e1c; --muted:#6b6862; --bg:#faf9f5; --panel:#fff; --line:#e6e3da; --soft:#f3f1ea;
  --ok:#2f7d4f; --ok-bg:#e5f3ea; --bad:#b5372d; --bad-bg:#fbe9e7; --open:#8a5a00; --open-bg:#fdf1d8; --void:#6b6862; --void-bg:#eeece6;
  --accent:#1f1e1c; --accent-fg:#faf9f5;
}
:root[data-theme="dark"]{
  --fg:#ecebe6; --muted:#a5a29a; --bg:#1b1a18; --panel:#252421; --line:#3a3834; --soft:#2c2b28;
  --ok:#5fbf85; --ok-bg:#1f3527; --bad:#e8695e; --bad-bg:#3d2220; --open:#e0a24a; --open-bg:#3a2f1c; --void:#a5a29a; --void-bg:#33312d;
  --accent:#ecebe6; --accent-fg:#1b1a18;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fg:#ecebe6; --muted:#a5a29a; --bg:#1b1a18; --panel:#252421; --line:#3a3834; --soft:#2c2b28;
  --ok:#5fbf85; --ok-bg:#1f3527; --bad:#e8695e; --bad-bg:#3d2220; --open:#e0a24a; --open-bg:#3a2f1c; --void:#a5a29a; --void-bg:#33312d;
  --accent:#ecebe6; --accent-fg:#1b1a18;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 48px}
.nav{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.nav a[aria-current=page]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
h1{font-family:var(--serif);font-weight:400;font-size:28px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:12px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;position:sticky;top:8px;z-index:3}
.tabs button{font:inherit;font-weight:600;border:0;background:none;color:var(--muted);padding:10px 4px;border-radius:9px;cursor:pointer;display:flex;gap:6px;justify-content:center;align-items:center}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-fg)}
.tabs .n{font-weight:500;font-size:11px;opacity:.75}
.tabs button:focus-visible,.slip-head:focus-visible,.more:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.tools{display:flex;gap:8px;margin:12px 0}
.tools input{flex:1;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg)}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.sum div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.sum span{display:block;font-size:11px;color:var(--muted)}
.sum b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(15px,4.4vw,20px);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.sum{grid-template-columns:repeat(2,1fr)}}
.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,480px),1fr));align-items:start}
.slip{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.slip-head{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;gap:10px;padding:12px 14px}
.row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sid{font-weight:700;letter-spacing:.02em}
.when{color:var(--muted);font-size:12px}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px}
.b-won{color:var(--ok);background:var(--ok-bg)} .b-lost{color:var(--bad);background:var(--bad-bg)}
.b-open{color:var(--open);background:var(--open-bg)} .b-cancelled{color:var(--void);background:var(--void-bg)}
.row2{display:grid;grid-template-columns:1fr 1fr .8fr 1.25fr;gap:8px}
.row2 span{display:block;font-size:11px;color:var(--muted)}
.row2 b{font-variant-numeric:tabular-nums;font-weight:600}
.row2 div:last-child{text-align:right}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.bar{flex:1;display:flex;height:6px;border-radius:999px;overflow:hidden;background:var(--soft)}
.bar i{display:block;height:100%}
.chev{transition:transform .2s;color:var(--muted)}
.slip[open] .chev{transform:rotate(180deg)}
.legs{border-top:1px solid var(--line);display:none}
.slip[open] .legs{display:block}
.leg{display:grid;grid-template-columns:20px 1fr auto;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:start}
.leg:last-child{border-bottom:0}
.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.d-won{background:var(--ok-bg);color:var(--ok)} .d-lost{background:var(--bad-bg);color:var(--bad)}
.d-void,.d-cancelled{background:var(--void-bg);color:var(--void)} .d-pending{background:var(--open-bg);color:var(--open)}
.teams{font-weight:600}
.pick{color:var(--muted);font-size:12px;margin-top:2px}
.lr{text-align:right;font-variant-numeric:tabular-nums}
.lr .o{font-weight:600}
.lr .sc{font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.more{display:block;margin:14px auto 0;font:inherit;font-weight:600;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.refresh{font:inherit;font-weight:600;font-size:13px;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;white-space:nowrap}
.refresh:disabled{opacity:.6;cursor:default}
.gate{min-height:70vh;display:grid;place-items:center}
.gate-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(100%,360px);display:grid;gap:12px}
.gate-box input[type=password]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.gate-box label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.gate-box button{font:inherit;font-weight:600;padding:10px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer}
.gate-err{color:var(--bad);font-size:12px;margin:0;min-height:1em}

body{padding-top:38px}
@media (max-width:440px){
  .wrap{padding-inline:12px}
  .row2{grid-template-columns:1fr 1fr}
  .row2 div:last-child{grid-column:1/-1;text-align:left;display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:6px}
  .tabs button{padding:10px 2px;font-size:13px}
  .tabs .n{font-size:10px}
  .sid{font-size:14px}
}
@media (max-width:340px){.sum div{padding:8px 10px}.prog{flex-wrap:wrap}.bar{flex-basis:100%;order:3}}
@media (min-width:1000px){.tabs,.tools,.sum{max-width:none}}
.el-theme{position:fixed;top:10px;right:12px;z-index:50;display:flex;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--panel);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.el-theme button{all:unset;cursor:pointer;width:30px;height:26px;display:grid;place-items:center;border-radius:999px;font-size:14px;color:var(--muted);line-height:1}
.el-theme button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.el-theme button:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
</style>
</head>
<body>
<div class="el-theme" role="group" aria-label="Theme">
  <button type="button" data-theme-set="light" title="Light" aria-label="Light theme"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <button type="button" data-theme-set="system" title="System" aria-label="Use system theme"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
  <button type="button" data-theme-set="dark" title="Dark" aria-label="Dark theme"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
</div>
<script>
(function(){
  var root=document.documentElement;
  function cur(){return root.getAttribute('data-theme')||'system';}
  function paint(){
    var c=cur(); document.querySelectorAll('[data-theme-set]').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-theme-set')===c));});
    var dark=c==='dark'||(c==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    var m=document.querySelector('meta[name=theme-color]'); if(m) m.setAttribute('content', dark?'#1c211e':'#f6f7f5');
  }
  document.querySelectorAll('[data-theme-set]').forEach(function(b){b.addEventListener('click',function(){
    var t=b.getAttribute('data-theme-set');
    if(t==='system'){root.removeAttribute('data-theme');try{localStorage.removeItem('el-theme');}catch(e){}}
    else{root.setAttribute('data-theme',t);try{localStorage.setItem('el-theme',t);}catch(e){}}
    paint(); window.dispatchEvent(new Event('resize'));
  });});
  try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paint);}catch(e){}
  paint();
})();
</script>

<div class="wrap">
<div class="gate" id="gate"><div class="gate-box">
  <h1>My slips</h1>
  <p class="sub" style="margin:0">Enter your passphrase to unlock your slips.</p>
  <input id="pass" type="password" autocomplete="current-password" aria-label="Passphrase">
  <label><input id="remember" type="checkbox"> Remember on this device</label>
  <button id="unlock">Unlock</button>
  <p class="gate-err" id="gate-err"></p>
</div></div>
<div id="app" hidden>
  <nav class="nav"><a href="./">Dashboard</a><a href="slips.html" aria-current="page">My slips</a></nav>
  <div class="head">
    <div><h1>My slips</h1><p class="sub" id="sub">Loading…</p></div>
    <button class="refresh" id="refresh" type="button" title="Ask your PC to collect your latest Betika slips, then reload">↻ Refresh</button>
  </div>

  <div class="tabs" role="tablist" aria-label="Slip status">
    <button role="tab" data-f="all" aria-selected="true">All <span class="n" id="n-all"></span></button>
    <button role="tab" data-f="open" aria-selected="false">Open <span class="n" id="n-open"></span></button>
    <button role="tab" data-f="won" aria-selected="false">Won <span class="n" id="n-won"></span></button>
    <button role="tab" data-f="lost" aria-selected="false">Lost <span class="n" id="n-lost"></span></button>
  </div>

  <div class="tools"><input id="q" type="search" placeholder="Search team, pick or slip ID" aria-label="Search slips"></div>

  <div class="sum">
    <div><span>Slips</span><b id="s-n">—</b></div>
    <div><span>Staked</span><b id="s-stake">—</b></div>
    <div><span>Returned</span><b id="s-ret">—</b></div>
    <div><span>Net</span><b id="s-net">—</b></div>
  </div>

  <div class="list" id="list"></div>
  <button class="more" id="more" hidden>Show more</button>
</div>
</div>

<script>
(() => {
  const PAGE = 25;
  let all = [], filter = 'all', query = '', shown = PAGE;
  const ksh = (v) => v == null ? '—' : 'KES ' + v.toLocaleString('en-KE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtDate = (s) => { const d = new Date(s.replace(' ', 'T')); return isNaN(d) ? s : d.toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };
  const label = { won: 'Won', lost: 'Lost', open: 'Open', cancelled: 'Cancelled' };
  const legMark = { won: '✓', lost: '✕', void: '–', cancelled: '–', pending: '•' };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  const params = new URLSearchParams(location.search);
  if (['all', 'open', 'won', 'lost'].includes(params.get('f'))) filter = params.get('f');

  function matches(s) {
    if (filter !== 'all' && s.status !== filter) return false;
    if (!query) return true;
    const q = query.toLowerCase();
    return s.id.toLowerCase().includes(q) || s.legs.some((l) => (l.home + ' ' + l.away + ' ' + l.pick + ' ' + l.market).toLowerCase().includes(q));
  }

  function slipCard(s) {
    const card = el('div', 'slip');
    const head = el('button', 'slip-head'); head.type = 'button'; head.setAttribute('aria-expanded', 'false');
    const r1 = el('div', 'row1');
    const left = el('div'); left.append(el('div', 'sid', s.id), el('div', 'when', fmtDate(s.placed)));
    const right = el('div'); right.style.display = 'flex'; right.style.gap = '8px'; right.style.alignItems = 'center';
    right.append(el('span', 'badge b-' + s.status, label[s.status] || s.status), el('span', 'chev', '▾'));
    r1.append(left, right);
    const r2 = el('div', 'row2');
    const cell = (k, v) => { const d = el('div'); d.append(el('span', null, k), el('b', null, v)); return d; };
    // Hit rate: legs won out of legs settled (won + lost); void and still-open legs are left out.
    const hitCell = (s) => {
      const settledLegs = (s.won || 0) + (s.lost || 0);
      const pct = settledLegs ? Math.round(100 * s.won / settledLegs) : null;
      const d = cell('Hit rate', pct == null ? '—' : pct + '%');
      d.title = settledLegs ? s.won + ' of ' + settledLegs + ' settled legs won' : 'No settled legs yet';
      return d;
    };
    r2.append(cell('Stake', ksh(s.stake)), cell('Total odds', s.odds == null ? '—' : s.odds.toLocaleString('en-KE', { maximumFractionDigits: 2 })),
      hitCell(s), cell(s.status === 'won' ? 'Payout' : 'Possible win', ksh(s.status === 'won' ? s.payout : s.possible_win)));
    const n = s.events || s.legs.length || 1;
    const prog = el('div', 'prog');
    const bar = el('div', 'bar');
    [['won', 'var(--ok)'], ['lost', 'var(--bad)'], ['void', 'var(--void)'], ['pending', 'var(--open)']].forEach(([k, c]) => {
      if (s[k]) { const i = el('i'); i.style.width = (100 * s[k] / n) + '%'; i.style.background = c; bar.append(i); }
    });
    const parts = [s.won + ' won', s.lost + ' lost'];
    if (s.void) parts.push(s.void + ' void'); if (s.pending) parts.push(s.pending + ' open');
    prog.append(el('span', null, n + ' games'), bar, el('span', null, parts.join(' · ')));
    head.append(r1, r2, prog);

    const legs = el('div', 'legs');
    let built = false;
    head.addEventListener('click', () => {
      const open = !card.hasAttribute('open');
      card.toggleAttribute('open', open); head.setAttribute('aria-expanded', String(open));
      if (open && !built) {
        built = true;
        s.legs.forEach((l) => {
          const row = el('div', 'leg');
          row.append(el('span', 'dot d-' + l.result, legMark[l.result] || '•'));
          const mid = el('div'); mid.append(el('div', 'teams', l.home + ' v ' + l.away), el('div', 'pick', l.market + ': ' + l.pick + ' · ' + fmtDate(l.kickoff)));
          const rr = el('div', 'lr'); rr.append(el('div', 'o', l.odds == null ? '—' : l.odds.toFixed(2)), el('div', 'sc', l.score || '—'));
          row.append(mid, rr); legs.append(row);
        });
        if (!s.legs.length) legs.append(el('div', 'empty', 'No game details saved for this slip.'));
      }
    });
    card.append(head, legs);
    return card;
  }

  function render() {
    document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.f === filter)));
    const counts = { all: all.length, open: 0, won: 0, lost: 0 };
    all.forEach((s) => { if (s.status in counts) counts[s.status]++; });
    Object.keys(counts).forEach((k) => { document.getElementById('n-' + k).textContent = counts[k]; });

    const rows = all.filter(matches);
    const settled = rows.filter((s) => s.status === 'won' || s.status === 'lost');
    const stake = settled.reduce((a, s) => a + (s.stake || 0), 0), ret = settled.reduce((a, s) => a + (s.payout || 0), 0);
    document.getElementById('s-n').textContent = rows.length.toLocaleString();
    document.getElementById('s-stake').textContent = ksh(stake);
    document.getElementById('s-ret').textContent = ksh(ret);
    const net = document.getElementById('s-net'); net.textContent = (ret - stake >= 0 ? '+' : '−') + ksh(Math.abs(ret - stake));
    net.style.color = ret - stake >= 0 ? 'var(--ok)' : 'var(--bad)';

    const list = document.getElementById('list'); list.replaceChildren();
    if (!rows.length) list.append(el('div', 'empty', filter === 'open' ? 'No open slips right now.' : 'No slips match.'));
    rows.slice(0, shown).forEach((s) => list.append(slipCard(s)));
    const more = document.getElementById('more'); more.hidden = rows.length <= shown;
    more.textContent = 'Show more (' + (rows.length - shown) + ' left)';
  }

  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
    filter = b.dataset.f; shown = PAGE;
    const u = new URL(location); u.searchParams.set('f', filter); history.replaceState(null, '', u);
    render();
  }));
  document.getElementById('q').addEventListener('input', (e) => { query = e.target.value.trim(); shown = PAGE; render(); });
  document.getElementById('more').addEventListener('click', () => { shown += PAGE; render(); });

  window.__showSlips = (d) => {
    all = d.slips || [];
    document.getElementById('sub').textContent = `Your Betika slips · data built ${d.built} · tap Refresh to check open slips now`;
    render();
  };
})();

(() => {
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function decrypt(pass) {
    const p = PAYLOAD, enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(p.salt), iterations: p.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(p.iv) }, key, b64(p.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  async function unlock(pass, silent) {
    const err = document.getElementById('gate-err');
    try {
      const doc = await decrypt(pass);
      window.__elDoc = doc;
      try { sessionStorage.setItem('el-pass', pass); } catch (e) {}
      if (document.getElementById('remember').checked) { try { localStorage.setItem('el-pass', pass); } catch (e) {} }
      document.getElementById('gate').hidden = true; document.getElementById('app').hidden = false;
      window.__showSlips(doc);
    } catch (e) {
      if (!silent) err.textContent = 'That passphrase did not unlock the data. Check it and try again.';
      try { localStorage.removeItem('el-pass'); sessionStorage.removeItem('el-pass'); } catch (x) {}
    }
  }
  document.getElementById('unlock').addEventListener('click', () => unlock(document.getElementById('pass').value));
  // Auto-refresh every 5 minutes while the page is visible and unlocked.
  setInterval(() => {
    if (document.visibilityState === 'visible' && !document.getElementById('app').hidden && !window.__elChecking) {
      const u = new URL(location); u.searchParams.set('r', Date.now()); location.replace(u);
    }
  }, 5 * 60 * 1000);
  document.getElementById('pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(e.target.value); });

  // Refresh: if there are open slips, ask your PC (via a private ntfy.sh topic) to run the
  // open-slip check, wait for it to finish and republish, then reload. Otherwise just reload.
  function elRefresh(btn, wantLive) {
    const reload = () => { const u = new URL(location); u.searchParams.set('r', Date.now()); location.replace(u); };
    const topic = window.__elDoc && window.__elDoc.ntfy;
    btn.disabled = true;
    if (!topic) { btn.textContent = 'Refreshing…'; reload(); return; }
    window.__elChecking = true;
    const t0 = Math.floor(Date.now() / 1000), started = Date.now();
    const tick = setInterval(() => { btn.textContent = 'Checking open slips… ' + Math.round((Date.now() - started) / 1000) + 's'; }, 1000);
    let es = null, finished = false;
    const finish = (text, wait) => { if (finished) return; finished = true; clearInterval(tick); try { es && es.close(); } catch (e) {} btn.textContent = text; setTimeout(reload, wait); };
    try {
      es = new EventSource('https://ntfy.sh/' + topic + '/sse?since=' + t0);
      es.onmessage = (ev) => { try { const m = JSON.parse(ev.data); if (String(m.message || '').startsWith('done')) finish('Updated, reloading…', 10000); } catch (e) {} };
    } catch (e) {}
    fetch('https://ntfy.sh/' + topic, { method: 'POST', body: 'refresh' })
      .catch(() => finish("Couldn't reach your PC, reloading…", 2500));
    setTimeout(() => finish('Your PC did not answer (is it on?), reloading…', 2500), 5 * 60 * 1000);
  }
  document.getElementById('refresh').addEventListener('click', (e) => elRefresh(e.currentTarget, (window.__elDoc && (window.__elDoc.slips || []).some((s) => s.status === 'open'))));
  let saved = null, remembered = false;
  try { saved = sessionStorage.getItem('el-pass'); if (!saved) { saved = localStorage.getItem('el-pass'); remembered = !!saved; } else { remembered = !!localStorage.getItem('el-pass'); } } catch (e) {}
  if (saved) { document.getElementById('remember').checked = remembered; unlock(saved, true); }
})();
